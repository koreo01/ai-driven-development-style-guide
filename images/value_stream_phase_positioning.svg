<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif">
  <rect width="1300" height="640" fill="#fafafa"/>

  <!-- Title -->
  <text x="20" y="38" font-size="22" font-weight="bold" fill="#1e293b">Phase別の人間／AI 位置取り（Value Stream 上での視覚化）</text>
  <text x="20" y="66" font-size="13" fill="#475569">Value Stream の主要ステージで、人間とAIがどこに位置するかはPhase進行で大きく変化する。既存図は Phase 1（副操縦士）視点の静止画</text>

  <!-- Header row -->
  <rect x="20" y="100" width="180" height="40" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="110" y="125" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Phase</text>

  <rect x="200" y="100" width="270" height="40" fill="#cbd5e1" stroke="#64748b"/>
  <text x="335" y="125" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">① 意図記述</text>

  <rect x="470" y="100" width="270" height="40" fill="#cbd5e1" stroke="#64748b"/>
  <text x="605" y="125" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">② AI協働実装</text>

  <rect x="740" y="100" width="270" height="40" fill="#cbd5e1" stroke="#64748b"/>
  <text x="875" y="125" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">③ Local合格ゲート</text>

  <rect x="1010" y="100" width="270" height="40" fill="#cbd5e1" stroke="#64748b"/>
  <text x="1145" y="125" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">④ Push→CI/CD境界</text>

  <!-- ===== Phase 0 row ===== -->
  <rect x="20" y="140" width="180" height="110" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="20" y="140" width="8" height="110" fill="#64748b"/>
  <text x="110" y="172" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Phase 0</text>
  <text x="110" y="194" font-size="12" fill="#1e293b" text-anchor="middle">接触</text>
  <text x="110" y="220" font-size="10" fill="#475569" text-anchor="middle">AI協働の入り口</text>
  <text x="110" y="236" font-size="10" fill="#475569" text-anchor="middle">READ調査のみ許容</text>

  <rect x="200" y="140" width="270" height="110" fill="white" stroke="#cbd5e1"/>
  <text x="215" y="168" font-size="12" font-weight="bold" fill="#1e293b">👤 人間が要求を言語化</text>
  <text x="215" y="192" font-size="11" fill="#475569">🤖 READ調査のみで支援</text>
  <text x="215" y="210" font-size="11" fill="#475569">（/prp-codebase-question）</text>
  <text x="215" y="236" font-size="10" fill="#64748b">変更操作はAIに依頼しない</text>

  <rect x="470" y="140" width="270" height="110" fill="white" stroke="#cbd5e1"/>
  <text x="485" y="168" font-size="12" font-weight="bold" fill="#1e293b">👤 人間が実装の全工程</text>
  <text x="485" y="192" font-size="11" fill="#475569">🤖 並列READ調査のみ</text>
  <text x="485" y="216" font-size="10" fill="#64748b">①〜③サイクルの操縦は</text>
  <text x="485" y="232" font-size="10" fill="#64748b">完全に人間が握る</text>

  <rect x="740" y="140" width="270" height="110" fill="white" stroke="#cbd5e1"/>
  <text x="755" y="168" font-size="12" font-weight="bold" fill="#1e293b">👤 人間が5項目を手動チェック</text>
  <text x="755" y="192" font-size="11" fill="#475569">ビルド／lint／UT／アーキ／AT</text>
  <text x="755" y="216" font-size="10" fill="#64748b">Hooks・Subagentは未導入</text>
  <text x="755" y="232" font-size="10" fill="#64748b">または最小構成</text>

  <rect x="1010" y="140" width="270" height="110" fill="white" stroke="#cbd5e1"/>
  <text x="1025" y="168" font-size="12" font-weight="bold" fill="#1e293b">👤 人間が手動 push</text>
  <text x="1025" y="192" font-size="11" fill="#475569">git push を直接実行</text>
  <text x="1025" y="216" font-size="10" fill="#64748b">CI/CD の通過判断も人間</text>
  <text x="1025" y="232" font-size="10" fill="#64748b">AIは関与しない</text>

  <!-- ===== Phase 1 row ===== -->
  <rect x="20" y="250" width="180" height="110" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <rect x="20" y="250" width="8" height="110" fill="#0284c7"/>
  <text x="110" y="282" font-size="15" font-weight="bold" fill="#0c4a6e" text-anchor="middle">Phase 1</text>
  <text x="110" y="304" font-size="12" fill="#0c4a6e" text-anchor="middle">ナビゲーター</text>
  <text x="110" y="330" font-size="10" fill="#075985" text-anchor="middle">操縦桿は人間</text>
  <text x="110" y="346" font-size="10" fill="#075985" text-anchor="middle">AIは副操縦士</text>

  <rect x="200" y="250" width="270" height="110" fill="white" stroke="#bae6fd"/>
  <text x="215" y="278" font-size="12" font-weight="bold" fill="#0c4a6e">👤 人間が意図を記述</text>
  <text x="215" y="302" font-size="11" fill="#075985">🤖 ドラフト・調査補助</text>
  <text x="215" y="320" font-size="11" fill="#075985">（/prp-plan, /prp-prd, /prp-debug）</text>
  <text x="215" y="346" font-size="10" fill="#0369a1">AI生成案は人間が逐次採否</text>

  <rect x="470" y="250" width="270" height="110" fill="white" stroke="#bae6fd"/>
  <text x="485" y="278" font-size="12" font-weight="bold" fill="#0c4a6e">👤 操縦桿は人間（実装主体）</text>
  <text x="485" y="302" font-size="11" fill="#075985">🤖 副操縦士で生成・検証補助</text>
  <text x="485" y="320" font-size="11" fill="#075985">①意図 → ②生成 → ③人間レビュー</text>
  <text x="485" y="346" font-size="10" fill="#0369a1">既存図の Phase 1 視点と一致</text>

  <rect x="740" y="250" width="270" height="110" fill="white" stroke="#bae6fd"/>
  <text x="755" y="278" font-size="12" font-weight="bold" fill="#0c4a6e">👤 人間がゲート判定</text>
  <text x="755" y="302" font-size="11" fill="#075985">🤖 Hooks（PostToolUse）・</text>
  <text x="755" y="318" font-size="11" fill="#075985">Subagent で一部自動化</text>
  <text x="755" y="346" font-size="10" fill="#0369a1">5項目を人＋AIで分担</text>

  <rect x="1010" y="250" width="270" height="110" fill="white" stroke="#bae6fd"/>
  <text x="1025" y="278" font-size="12" font-weight="bold" fill="#0c4a6e">👤 人間が push 判断</text>
  <text x="1025" y="302" font-size="11" fill="#075985">🤖 コミットメッセージ案</text>
  <text x="1025" y="318" font-size="11" fill="#075985">（/prp-commit）</text>
  <text x="1025" y="346" font-size="10" fill="#0369a1">人間が確認して push</text>

  <!-- ===== Phase 2 row ===== -->
  <rect x="20" y="360" width="180" height="110" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="20" y="360" width="8" height="110" fill="#059669"/>
  <text x="110" y="392" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">Phase 2</text>
  <text x="110" y="414" font-size="12" fill="#065f46" text-anchor="middle">バディ</text>
  <text x="110" y="440" font-size="10" fill="#047857" text-anchor="middle">AIに実装を委任</text>
  <text x="110" y="456" font-size="10" fill="#047857" text-anchor="middle">人間は意図・採否</text>

  <rect x="200" y="360" width="270" height="110" fill="white" stroke="#a7f3d0"/>
  <text x="215" y="388" font-size="12" font-weight="bold" fill="#065f46">👤 人間が意図を記述</text>
  <text x="215" y="412" font-size="11" fill="#047857">🤖 PRD・Plan ドラフト</text>
  <text x="215" y="428" font-size="11" fill="#047857">（/prp-prd, /prp-plan）</text>
  <text x="215" y="456" font-size="10" fill="#065f46">人間は意図記述と採否に集中</text>

  <rect x="470" y="360" width="270" height="110" fill="white" stroke="#a7f3d0"/>
  <text x="485" y="388" font-size="12" font-weight="bold" fill="#065f46">🤖 AI が実装の主体</text>
  <text x="485" y="412" font-size="11" fill="#047857">（/prp-implement, /prp-issue-fix）</text>
  <text x="485" y="436" font-size="10" fill="#065f46">👤 人間は意図記述・</text>
  <text x="485" y="452" font-size="10" fill="#065f46">採否ゲートに集中</text>

  <rect x="740" y="360" width="270" height="110" fill="white" stroke="#a7f3d0"/>
  <text x="755" y="388" font-size="12" font-weight="bold" fill="#065f46">🤖 AI が連続実行</text>
  <text x="755" y="412" font-size="11" fill="#047857">（/prp-review, /prp-review-agents）</text>
  <text x="755" y="436" font-size="10" fill="#065f46">👤 人間は採否ゲートで</text>
  <text x="755" y="452" font-size="10" fill="#065f46">停止可能</text>

  <rect x="1010" y="360" width="270" height="110" fill="white" stroke="#a7f3d0"/>
  <text x="1025" y="388" font-size="12" font-weight="bold" fill="#065f46">🤖 push 支援</text>
  <text x="1025" y="412" font-size="11" fill="#047857">コミット・push まで AI 実施</text>
  <text x="1025" y="436" font-size="10" fill="#065f46">👤 人間は最終採否のみ</text>

  <!-- ===== Phase 3 row ===== -->
  <rect x="20" y="470" width="180" height="110" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="20" y="470" width="8" height="110" fill="#7c3aed"/>
  <text x="110" y="502" font-size="15" font-weight="bold" fill="#5b21b6" text-anchor="middle">Phase 3</text>
  <text x="110" y="524" font-size="12" fill="#5b21b6" text-anchor="middle">自律</text>
  <text x="110" y="550" font-size="10" fill="#6d28d9" text-anchor="middle">検証通過まで</text>
  <text x="110" y="566" font-size="10" fill="#6d28d9" text-anchor="middle">AIが自律ループ</text>

  <rect x="200" y="470" width="270" height="110" fill="white" stroke="#ddd6fe"/>
  <text x="215" y="498" font-size="12" font-weight="bold" fill="#5b21b6">👤 人間が発案・トリガ</text>
  <text x="215" y="522" font-size="11" fill="#6d28d9">🤖 PRP ドラフトを生成</text>
  <text x="215" y="540" font-size="11" fill="#6d28d9">（/prp-prd, /prp-plan を内包）</text>
  <text x="215" y="566" font-size="10" fill="#5b21b6">人間は方向性のみ提示</text>

  <rect x="470" y="470" width="270" height="110" fill="white" stroke="#ddd6fe"/>
  <text x="485" y="498" font-size="12" font-weight="bold" fill="#5b21b6">🔁 AI が自律ループ</text>
  <text x="485" y="522" font-size="11" fill="#6d28d9">（/prp-ralph）</text>
  <text x="485" y="540" font-size="11" fill="#6d28d9">検証NGなら再試行を内包</text>
  <text x="485" y="566" font-size="10" fill="#5b21b6">👤 ループ停止権を持つ</text>

  <rect x="740" y="470" width="270" height="110" fill="white" stroke="#ddd6fe"/>
  <text x="755" y="498" font-size="12" font-weight="bold" fill="#5b21b6">🔁 AI ループ内で全項目通過</text>
  <text x="755" y="522" font-size="11" fill="#6d28d9">合格まで内部で反復</text>
  <text x="755" y="546" font-size="10" fill="#5b21b6">👤 停止権</text>
  <text x="755" y="562" font-size="10" fill="#5b21b6">（/prp-ralph-cancel）</text>

  <rect x="1010" y="470" width="270" height="110" fill="white" stroke="#ddd6fe"/>
  <text x="1025" y="498" font-size="12" font-weight="bold" fill="#5b21b6">👤 最終採否（Yes/No）</text>
  <text x="1025" y="522" font-size="11" fill="#6d28d9">ループ完了成果物を確認</text>
  <text x="1025" y="546" font-size="10" fill="#5b21b6">🔁 push まで AI が実施可</text>
  <text x="1025" y="562" font-size="10" fill="#5b21b6">人間は採否ゲートを握る</text>

  <!-- Bottom red gate band -->
  <rect x="20" y="600" width="1260" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="650" y="624" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">🚦 Push（CI/CDへ渡す）の最終採否（Yes/No）はどのPhaseでも人間が握る — Local合格＋Pushの判断は人間に残る</text>
</svg>
