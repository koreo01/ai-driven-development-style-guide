<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>セッション開始の開始判定と分岐</title>
<desc>現在の作業状況の確認から、作業対象の有無・前作業のマージ状態を判定し、正常スタート・ケースA（マージ待ち）・ケースB（チケット未整備）に分岐する流れ。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
svg { color:#3d3d3a; }
@media (prefers-color-scheme: dark){ svg { color:#c9c7be; } }
.th { font-size:14px; font-weight:500; }
.ts { font-size:12px; font-weight:400; opacity:0.85; }
.arr { stroke: currentColor; stroke-width:1.5; fill:none; }
.box-teal { fill:#e1f5ee; stroke:#0f6e56; }
.box-green{ fill:#eaf3de; stroke:#639922; }
.box-red  { fill:#fcebeb; stroke:#a32d2d; }
.box-blue { fill:#e6f1fb; stroke:#185fa5; }
.tx-teal{fill:#04342c;} .tx-green{fill:#173404;} .tx-red{fill:#501313;} .tx-blue{fill:#042c53;}
.sub-teal{fill:#0f6e56;} .sub-green{fill:#3b6d11;} .sub-red{fill:#791f1f;} .sub-blue{fill:#0c447c;}
.note{ fill:#5f5e5a; }
@media (prefers-color-scheme: dark){
.box-teal{fill:#04342c;stroke:#5dcaa5;} .box-green{fill:#173404;stroke:#97c459;}
.box-red{fill:#501313;stroke:#f09595;} .box-blue{fill:#042c53;stroke:#85b7eb;}
.tx-teal,.tx-green,.tx-red,.tx-blue{fill:#f1efe8;}
.sub-teal{fill:#9fe1cb;} .sub-green{fill:#c0dd97;} .sub-red{fill:#f7c1c1;} .sub-blue{fill:#b5d4f4;}
.note{fill:#b4b2a9;}
}
</style>
</defs>

<rect x="210" y="40" width="260" height="52" rx="8" stroke-width="0.5" class="box-teal"/>
<text class="th tx-teal" x="340" y="60" text-anchor="middle" dominant-baseline="central">Step 1: 現在の作業状況の確認</text>
<text class="ts sub-teal" x="340" y="78" text-anchor="middle" dominant-baseline="central">status/current.md を読み込む</text>
<line x1="340" y1="92" x2="340" y2="118" class="arr" marker-end="url(#arrow)"/>
<text class="ts note" x="490" y="108">ファイルなし</text>
<path d="M470 66 L600 66 L600 470" fill="none" class="arr" marker-end="url(#arrow)" stroke="#185fa5"/>

<rect x="210" y="118" width="260" height="52" rx="8" stroke-width="0.5" class="box-teal"/>
<text class="th tx-teal" x="340" y="138" text-anchor="middle" dominant-baseline="central">Step 2: 作業対象の有無を判定</text>
<text class="ts sub-teal" x="340" y="156" text-anchor="middle" dominant-baseline="central">条件① Open な SubTask が存在するか</text>
<line x1="340" y1="170" x2="340" y2="196" class="arr" marker-end="url(#arrow)"/>
<text class="ts note" x="510" y="186">全件 Done</text>
<path d="M470 144 L570 144 L570 470" fill="none" class="arr" marker-end="url(#arrow)" stroke="#185fa5"/>

<rect x="210" y="196" width="260" height="52" rx="8" stroke-width="0.5" class="box-teal"/>
<text class="th tx-teal" x="340" y="216" text-anchor="middle" dominant-baseline="central">Step 3: 前作業のマージ状態を判定</text>
<text class="ts sub-teal" x="340" y="234" text-anchor="middle" dominant-baseline="central">条件② 同一ブランチ / 未マージの有無</text>
<line x1="340" y1="248" x2="340" y2="290" class="arr" marker-end="url(#arrow)"/>
<text class="ts note" x="115" y="224">未マージあり</text>
<path d="M210 222 L80 222 L80 470" fill="none" class="arr" marker-end="url(#arrow)" stroke="#a32d2d"/>

<rect x="210" y="290" width="260" height="56" rx="8" stroke-width="0.5" class="box-green"/>
<text class="th tx-green" x="340" y="310" text-anchor="middle" dominant-baseline="central">正常スタート（主線）</text>
<text class="ts sub-green" x="340" y="330" text-anchor="middle" dominant-baseline="central">STARTED に設定 → SubTask 着手</text>

<text class="ts note" x="340" y="380" text-anchor="middle">──── 例外系の分岐（通常は発生しない）────</text>

<rect x="40" y="470" width="180" height="80" rx="8" stroke-width="0.5" class="box-red"/>
<text class="th tx-red" x="130" y="492" text-anchor="middle" dominant-baseline="central">ケースA</text>
<text class="ts sub-red" x="130" y="512" text-anchor="middle" dominant-baseline="central">前ブランチのマージ待ち</text>
<text class="ts sub-red" x="130" y="530" text-anchor="middle" dominant-baseline="central">（セーフティネット）</text>

<rect x="460" y="470" width="180" height="80" rx="8" stroke-width="0.5" class="box-blue"/>
<text class="th tx-blue" x="550" y="492" text-anchor="middle" dominant-baseline="central">ケースB</text>
<text class="ts sub-blue" x="550" y="512" text-anchor="middle" dominant-baseline="central">チケット未整備</text>
<text class="ts sub-blue" x="550" y="530" text-anchor="middle" dominant-baseline="central">→ SubTask 自動起票</text>

<text class="ts note" x="340" y="580" text-anchor="middle">ケースA/B は処理後、条件①判定に戻って再開する</text>
</svg>
