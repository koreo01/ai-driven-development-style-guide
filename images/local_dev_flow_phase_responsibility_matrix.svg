<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" font-family="'Hiragino Sans', 'Yu Gothic', sans-serif">
  <rect width="1300" height="640" fill="#fafafa"/>

  <!-- Title -->
  <text x="20" y="38" font-size="22" font-weight="bold" fill="#1e293b">Phase別の主要ステップ責務シフト</text>
  <text x="20" y="66" font-size="13" fill="#475569">①〜④・⑥-1・⑧は全Phase共通の手続き。Phase間で関与度が大きく変わるのは⑤実装・編集／⑥-2 コミット／⑦完了チェックリストの3ステップ</text>

  <!-- Header row -->
  <rect x="20" y="100" width="200" height="40" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="120" y="125" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Phase</text>

  <rect x="220" y="100" width="350" height="40" fill="#cbd5e1" stroke="#64748b"/>
  <text x="395" y="125" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">⑤ 実装・編集</text>

  <rect x="570" y="100" width="350" height="40" fill="#cbd5e1" stroke="#64748b"/>
  <text x="745" y="125" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">⑥-2 コミット</text>

  <rect x="920" y="100" width="360" height="40" fill="#cbd5e1" stroke="#64748b"/>
  <text x="1100" y="125" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">⑦ 完了チェックリスト</text>

  <!-- ===== Phase 0 row ===== -->
  <rect x="20" y="140" width="200" height="110" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="20" y="140" width="8" height="110" fill="#64748b"/>
  <text x="120" y="172" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Phase 0</text>
  <text x="120" y="194" font-size="12" fill="#1e293b" text-anchor="middle">接触</text>
  <text x="120" y="220" font-size="10" fill="#475569" text-anchor="middle">AI協働の入り口</text>
  <text x="120" y="236" font-size="10" fill="#475569" text-anchor="middle">並列READ調査が主</text>

  <rect x="220" y="140" width="350" height="110" fill="white" stroke="#cbd5e1"/>
  <text x="240" y="170" font-size="13" font-weight="bold" fill="#1e293b">👤 人間が実装・調査の主体</text>
  <text x="240" y="194" font-size="11" fill="#475569">🤖 AIは並列READ調査のみ</text>
  <text x="240" y="212" font-size="11" fill="#475569">（/prp-codebase-question 等）</text>
  <text x="240" y="236" font-size="10" fill="#64748b">変更を伴うAI操作は行わない</text>

  <rect x="570" y="140" width="350" height="110" fill="white" stroke="#cbd5e1"/>
  <text x="590" y="170" font-size="13" font-weight="bold" fill="#1e293b">👤 人間が手動コミット</text>
  <text x="590" y="194" font-size="11" fill="#475569">git add / git commit を直接実行</text>
  <text x="590" y="218" font-size="10" fill="#64748b">AIはコミットメッセージ案も</text>
  <text x="590" y="234" font-size="10" fill="#64748b">出さない</text>

  <rect x="920" y="140" width="360" height="110" fill="white" stroke="#cbd5e1"/>
  <text x="940" y="170" font-size="13" font-weight="bold" fill="#1e293b">👤 人間が4項目を手動実施</text>
  <text x="940" y="194" font-size="11" fill="#475569">Notion更新／summary作成／</text>
  <text x="940" y="210" font-size="11" fill="#475569">status更新／push</text>
  <text x="940" y="236" font-size="10" fill="#64748b">AIは観測者として横で見守る</text>

  <!-- ===== Phase 1 row ===== -->
  <rect x="20" y="250" width="200" height="110" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <rect x="20" y="250" width="8" height="110" fill="#0284c7"/>
  <text x="120" y="282" font-size="15" font-weight="bold" fill="#0c4a6e" text-anchor="middle">Phase 1</text>
  <text x="120" y="304" font-size="12" fill="#0c4a6e" text-anchor="middle">ナビゲーター</text>
  <text x="120" y="330" font-size="10" fill="#075985" text-anchor="middle">操縦桿は人間</text>
  <text x="120" y="346" font-size="10" fill="#075985" text-anchor="middle">AIは副操縦士</text>

  <rect x="220" y="250" width="350" height="110" fill="white" stroke="#bae6fd"/>
  <text x="240" y="280" font-size="13" font-weight="bold" fill="#0c4a6e">👤 人間が実装の主体</text>
  <text x="240" y="304" font-size="11" fill="#075985">🤖 AIは設計・ドラフト・調査補助</text>
  <text x="240" y="322" font-size="11" fill="#075985">（/prp-plan, /prp-prd, /prp-debug）</text>
  <text x="240" y="346" font-size="10" fill="#0369a1">AI生成物は人間が逐次採否</text>

  <rect x="570" y="250" width="350" height="110" fill="white" stroke="#bae6fd"/>
  <text x="590" y="280" font-size="13" font-weight="bold" fill="#0c4a6e">👤 人間が実行</text>
  <text x="590" y="304" font-size="11" fill="#075985">🤖 AIはメッセージ案を生成</text>
  <text x="590" y="320" font-size="11" fill="#075985">（/prp-commit）</text>
  <text x="590" y="346" font-size="10" fill="#0369a1">人間が確認して採用・実行</text>

  <rect x="920" y="250" width="360" height="110" fill="white" stroke="#bae6fd"/>
  <text x="940" y="280" font-size="13" font-weight="bold" fill="#0c4a6e">👤 人間が4項目を実施</text>
  <text x="940" y="304" font-size="11" fill="#075985">🤖 AIはsummary草稿・status更新案</text>
  <text x="940" y="320" font-size="11" fill="#075985">を補助</text>
  <text x="940" y="346" font-size="10" fill="#0369a1">承認・最終確定は人間</text>

  <!-- ===== Phase 2 row ===== -->
  <rect x="20" y="360" width="200" height="110" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="20" y="360" width="8" height="110" fill="#059669"/>
  <text x="120" y="392" font-size="15" font-weight="bold" fill="#065f46" text-anchor="middle">Phase 2</text>
  <text x="120" y="414" font-size="12" fill="#065f46" text-anchor="middle">バディ</text>
  <text x="120" y="440" font-size="10" fill="#047857" text-anchor="middle">AIに実装を委任</text>
  <text x="120" y="456" font-size="10" fill="#047857" text-anchor="middle">人間は意図・採否</text>

  <rect x="220" y="360" width="350" height="110" fill="white" stroke="#a7f3d0"/>
  <text x="240" y="390" font-size="13" font-weight="bold" fill="#065f46">🤖 AIが実装を担う</text>
  <text x="240" y="414" font-size="11" fill="#047857">（/prp-implement, /prp-issue-fix,</text>
  <text x="240" y="430" font-size="11" fill="#047857">/prp-review, /prp-review-agents）</text>
  <text x="240" y="456" font-size="10" fill="#065f46">👤 人間は意図記述・採否ゲートに集中</text>

  <rect x="570" y="360" width="350" height="110" fill="white" stroke="#a7f3d0"/>
  <text x="590" y="390" font-size="13" font-weight="bold" fill="#065f46">🤖 AIがコミット実行</text>
  <text x="590" y="414" font-size="11" fill="#047857">メッセージ生成からgit commitまで</text>
  <text x="590" y="430" font-size="11" fill="#047857">一連でAIが実施</text>
  <text x="590" y="456" font-size="10" fill="#065f46">👤 人間は採否ゲートで停止可能</text>

  <rect x="920" y="360" width="360" height="110" fill="white" stroke="#a7f3d0"/>
  <text x="940" y="390" font-size="13" font-weight="bold" fill="#065f46">🤖 AIが4項目を実施</text>
  <text x="940" y="414" font-size="11" fill="#047857">Notion更新／summary作成／</text>
  <text x="940" y="430" font-size="11" fill="#047857">status更新／push を連続実行</text>
  <text x="940" y="456" font-size="10" fill="#065f46">👤 人間は最終採否のみ</text>

  <!-- ===== Phase 3 row ===== -->
  <rect x="20" y="470" width="200" height="110" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="20" y="470" width="8" height="110" fill="#7c3aed"/>
  <text x="120" y="502" font-size="15" font-weight="bold" fill="#5b21b6" text-anchor="middle">Phase 3</text>
  <text x="120" y="524" font-size="12" fill="#5b21b6" text-anchor="middle">自律</text>
  <text x="120" y="550" font-size="10" fill="#6d28d9" text-anchor="middle">検証通過まで</text>
  <text x="120" y="566" font-size="10" fill="#6d28d9" text-anchor="middle">AIが自律ループ</text>

  <rect x="220" y="470" width="350" height="110" fill="white" stroke="#ddd6fe"/>
  <text x="240" y="500" font-size="13" font-weight="bold" fill="#5b21b6">🔁 AIが自律ループ</text>
  <text x="240" y="524" font-size="11" fill="#6d28d9">（/prp-ralph） 検証NGなら再試行を</text>
  <text x="240" y="540" font-size="11" fill="#6d28d9">内部で繰り返す</text>
  <text x="240" y="566" font-size="10" fill="#5b21b6">👤 人間は発案・トリガ・最終採否のみ</text>

  <rect x="570" y="470" width="350" height="110" fill="white" stroke="#ddd6fe"/>
  <text x="590" y="500" font-size="13" font-weight="bold" fill="#5b21b6">🔁 AI自律ループに内包</text>
  <text x="590" y="524" font-size="11" fill="#6d28d9">コミットは自律ループ内で連続発生</text>
  <text x="590" y="550" font-size="10" fill="#5b21b6">👤 人間はループ停止権を持つ</text>
  <text x="590" y="566" font-size="10" fill="#5b21b6">（/prp-ralph-cancel）</text>

  <rect x="920" y="470" width="360" height="110" fill="white" stroke="#ddd6fe"/>
  <text x="940" y="500" font-size="13" font-weight="bold" fill="#5b21b6">🔁 AI自律ループに内包</text>
  <text x="940" y="524" font-size="11" fill="#6d28d9">完了チェックリストもAIが連続実施</text>
  <text x="940" y="550" font-size="10" fill="#5b21b6">👤 人間はループ完了後の</text>
  <text x="940" y="566" font-size="10" fill="#5b21b6">最終採否(Yes/No)を握る</text>

  <!-- Bottom red gate band -->
  <rect x="20" y="600" width="1260" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="650" y="624" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">🚦 採否(Yes/No)の最終ゲートはどのPhaseでも人間が握る（⑥-1 変更内容承認・⑦ 完了チェックリスト承認）</text>
</svg>
